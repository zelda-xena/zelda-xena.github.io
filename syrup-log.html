<html>
    <head>
        <title> Love Life Count Log </title>
        <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.8/dist/jspdf.plugin.autotable.min.js"></script>
        <link rel="stylesheet" href="log.css">
    </head>

    <body>
        <h1> Syrup Log &#9749 </h1>

        <a href="index.html"><button class="link-btn"> Go to Pastry Count! </button></a><br><br>

        <div class="main-container"> 
            <!-- add new pastry to checklist -->
            <div class="container1">
                <input type="text" id="syrupList" name="syrupList" style="width: 250px;" placeholder="Add Syrup to Table"/>
                <button class="addlist-btn" onclick="addSyrupRow()"> + </button><br><br>
            </div>

            <div class="container2"> 
                <label> Date: </label>
                <input type="date" id="current-date">
                <button class="download-btn" onclick="downloadPDF()"> Download Table as PDF</button>
                <button class="reset-btn" onclick="resetQty()"> Reset Quantities </button><br><br>
            
                <table id="countTable"> 
                    <thead>
                        <tr>
                            <th> </th>
                            <th> Syrup </th>
                            <th> Open Qty </th>
                            <th> Unopen Qty </th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"> 
                        <!-- new dynamic rows that will be added based on input-->
                    </tbody> 
                </table>
            </div>
        </div>
    </body>

    <script>
        // set to today's date
        document.getElementById("current-date").valueAsDate = new Date();
        
        // load saved table on page load
        document.addEventListener("DOMContentLoaded", loadData);

        // helper function to format the syrup title
        function formatName(name) {
            return name.toLowerCase()
                        .split(" ")
                        .filter(word => word.length > 0)
                        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                        .join(" ");
        }

        // helper function to sort table in alphabetical order
        function alphabetizeTable() {
        }

        // add new syrup to table
        function addSyrupRow() {
            const syrupInput = document.getElementById("syrupList");
            const syrupName = formatName(syrupInput.value.trim());

            if(syrupName === "") {
                alert("Please Enter Syrup!");
                return;
            }

            createRowElement(syrupName, 0, 0);

            syrupInput.value = ""; // clears input field

            alphabetizeTable();
            saveData();
        }

        // helper function to build on DOM rows
        function createRowElement(name, openQty, unopenQty) {
            const tableBody = document.getElementById("tableBody");
            const row = document.createElement("tr");

            row.innerHTML = `<td>
                                <button class="delete-btn" onclick="deleteSyrupRow(this)"> X </button>
                            </td>
                            <td class="syrup-name-cell"> ${name} </td>
                            <td>
                                <input type="number" class="open-qty" min="0" value="${openQty}" onchange="saveData()">
                            </td>
                            <td>
                                <input type="number" class="unopen-qty" min="0" value="${unopenQty}" onchange="saveData()">
                            </td>`
            tableBody.appendChild(row);
        }

        // delete syrup from table
        function deleteSyrupRow(button) {
            button.closest("tr").remove();
            saveData();
        }

        // collects current page data and saves to local storage
        function saveData() {
        }

        // reads page data and rebuilds on page load
        function loadData() {
        }

        // download table as PDF
        async function downloadPDF() {
        }

        // clears quantities from table only
        function resetQty() {
            saveData();
        }
    </script>
</html>
