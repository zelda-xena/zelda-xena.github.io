<html>
    <head>
        <title> Pastry Log - Tracker </title>
        <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.8/dist/jspdf.plugin.autotable.min.js"></script>
        <link rel="stylesheet" href="pastry-log.css">
    </head>

    <body>
        <h1> Pastry Log &#129360 </h1>

        <a href="index.html"><button class="link-btn"> Go to Count! </button></a><br><br>

        <div class="form-container">
            <input list="pastries" id="pastryName" name="pastryName" style="width: 250px;" placeholder="Enter Pastry"/>
            <datalist id="pastries">
                <option> Apple Turnover </option>
                <option> Butter Croissant </option>
                <option> Cheese Danish </option>
                <option> Hazelnut Chocolate Croissant </option>
                <option> Cinnamon Raisin Bagel </option>
                <option> Everything Bagel </option>
                <option> Plain Bagel </option>
                <option> Vegan Croissant </option>
            </datalist>
            <button class="add-btn" onclick="addPastryRow()"> Add </button><br>
        </div>

        <div class="contaner2"> 
            <label> Date: </label>
            <input type="date" id="current-date">
            <button class="download-btn" onclick="downloadPDF()"> Download Count as PDF </button>
            <button class="clear-btn" onclick="clearTable()"> Clear Table </button><br><br>
        </div>

        <table id="countTable">
            <thead>
                <tr>
                    <th>   </th>
                    <th> Pastry </th>
                    <th> Current Qty </th>
                    <th> Received Amt </th>
                    <th> Qty Sold </th>
                    <th> Wasted/Comped </th>
                    <!-- use formula: (current + rec - sold - wasted/comped)-->
                    <th> Ending Qty </th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- new dynamic rows that will be added based on input -->
            </tbody>
        </table><br>

        <script>
            // set to today's date
            document.getElementById("current-date").valueAsDate = new Date();

            // load saved table on page load
            document.addEventListener("DOMContentLoaded", loadTableData);
            
            // add new pastry to table
            function addPastryRow() {
                const pastryInput = document.getElementById("pastryName");
                const pastryName = pastryInput.value.trim();

                if(pastryName === "") {
                    alert("Please Enter Pastry!");
                    return;
                }

                createRowElement(pastryName, "", "", "", "");
                saveTableData();
                pastryInput.value = "";
            }

            // helper function to build DOM rows
            function createRowElement(pastryName, currentQty = 0, receivedQty = 0, soldQty = 0, wastedQty = 0) {
                const tableBody = document.getElementById("tableBody");
                const row = tableBody.insertRow();

                row.insertCell(0).innerHTML = 
                    '<button class="delete-btn" onclick="deletePastryRow(this)"> X </button>';
                const nameCell = row.insertCell(1);
                nameCell.textContent = pastryName;
                nameCell.classList.add("pastry-name-cell");
                row.insertCell(2).innerHTML =
                    `<input type="number" class="current-qty" min="0" value="${currentQty}">`;
                row.insertCell(3).innerHTML =
                    `<input type="number" class="received-qty" min="0" value="${receivedQty}">`;
                row.insertCell(4).innerHTML =
                    `<input type="number" class="sold-qty" min="0" value="${soldQty}">`;
                row.insertCell(5).innerHTML =
                    `<input type="number" class="wasted-qty" min="0" value="${wastedQty}">`;
                const endingQty = 
                    Number(currentQty) + Number(receivedQty) - Number(soldQty) - Number(wastedQty);
                row.insertCell(6).textContent = endingQty;
                
                row.querySelectorAll("input").forEach(input => {
                    input.addEventListener("input", function() {
                        input.style.fontsize = "15px";
                        calculateEndQty(this);
                        saveTableData();
                    });
                });
            }

            // calculate end qty in table
            function calculateEndQty(input) {
                const row = input.closest("tr");
                const current = Number(row.querySelector(".current-qty").value) || 0;
                const received = Number(row.querySelector(".received-qty").value) || 0;
                const sold = Number(row.querySelector(".sold-qty").value) || 0;
                const wasted = Number(row.querySelector(".wasted-qty").value) || 0;
                const ending = current + received - sold - wasted;

                row.cells[6].textContent = ending;
            }

            // delete pastry from table
            function deletePastryRow(button) {
                button.closest("tr").remove();
                saveTableData();
            }

            // collects current table data and saves to local storage
            function saveTableData() {
                const rowsData = [];
                const rows = document.querySelectorAll("#tableBody tr");

                rows.forEach(row => {
                    rowsData.push({
                        name: row.querySelector(".pastry-name-cell").textContent,
                        currentQty: row.querySelector(".current-qty").value,
                        receivedQty: row.querySelector(".received-qty").value,
                        soldQty: row.querySelector(".sold-qty").value,
                        wastedQty: row.querySelector(".wasted-qty").value
                    });
                });

                localStorage.setItem("pastryTrackerData", JSON.stringify(rowsData));
            }

            // reads table data and rebuilds on page load
            function loadTableData() {
                const savedData = localStorage.getItem("pastryTrackerData");
                if(savedData) {
                    const rowsData = JSON.parse(savedData);
                    rowsData.forEach(item => {
                        createRowElement(item.name, item.currentQty, item.receivedQty, item.soldQty, item.wastedQty);
                    });
                }
            }

            // download table as PDF
            async function downloadPDF() {
                const {jsPDF} = window.jspdf;
                const tableClone = document.getElementById("countTable").cloneNode(true);

                // remove first col from every row
                tableClone.querySelectorAll("tr").forEach(row => {
                    if(row.cells.length > 0) {
                        row.deleteCell(0);
                    }
                });

                tableClone.querySelectorAll("input").forEach(input => {
                    input.parentElement.textContent = input.value;
                })

                // add cloned table temp to DOM
                const tempDiv = document.createElement("div");

                tempDiv.style.position = "absolute";
                tempDiv.style.left = "-9999px";
                tempDiv.appendChild(tableClone);
                document.body.appendChild(tempDiv);

                const date = document.getElementById("current-date").value;
                const [year, month, day] = date.split("-");
                const formatDate = `${month}/${day}/${year}`;

                const pdf = new jsPDF({
                    orientation: "landscape",
                    unit: "mm", 
                    format: "a4"
                });

                // header in pdf
                pdf.setFontSize(18);
                pdf.text("Pastry Tracker", 14, 15);
                pdf.setFontSize(16);
                pdf.text(`Date: ${date}`, 14, 25);
                //table in pdf
                pdf.autoTable({
                    html: tableClone,
                    startY: 30,
                    theme: "grid",
                    headStyles: {fillColor: [31, 78, 121]}, 
                    styles: {fontSize: 12}, 
                    margin: {left: 10, right: 10}
                });

                document.body.removeChild(tempDiv);

                // saves to device
                pdf.save(`pastry-tracker-${formatDate}.pdf`);
            }

            // clears table on command
            function clearTable() {
                const tableBody = document.getElementById("tableBody");
                tableBody.innerHTML = "";
                saveTableData();
            }
        </script>
    </body>
</html>
